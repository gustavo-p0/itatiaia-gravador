name: Gravar Rádio Itatiaia

on:
  workflow_dispatch:
  repository_dispatch:
    types: [gravar]

env:
  RECORD_SECONDS: "14400"
  AUDIO_BITRATE: 48k

jobs:
  gravar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Preparar nomes dos arquivos
        run: |
          DATA=$(TZ="America/Sao_Paulo" date +%Y-%m-%d)
          echo "RAW_FILE=itatiaia_${DATA}.wav" >> "$GITHUB_ENV"
          echo "COMPRESSED_FILE=itatiaia_${DATA}.mp3" >> "$GITHUB_ENV"

      - name: Instalar ffmpeg e rclone com retry
        run: |
          retry_with_backoff() {
            local max_attempts="$1"
            shift
            local attempt=1
            local delay=5
            until "$@"; do
              if (( attempt >= max_attempts )); then
                echo "Falha definitiva após $attempt tentativas: $*" >&2
                return 1
              fi
              echo "Tentativa $attempt falhou; aguardando ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
              (( delay > 60 )) && delay=60
            done
          }

          retry_with_backoff 5 sudo apt-get -o Acquire::Retries=3 update
          retry_with_backoff 5 sudo apt-get -o Acquire::Retries=3 install -y --fix-missing ffmpeg
          curl --fail --location \
            --retry 6 --retry-all-errors --retry-max-time 180 \
            --output /tmp/install-rclone.sh \
            https://rclone.org/install.sh
          sudo bash /tmp/install-rclone.sh
          rm -f /tmp/install-rclone.sh

      - name: Gravar e normalizar o stream por 4 horas com Fallback
        run: |
          STREAMS=(
            "https://8903.brasilstream.com.br/stream"
            "http://8903.brasilstream.com.br:8903/stream"
            "https://8903.brasilstream.com.br/stream?ext=.mp3"
          )
          
          for URL in "${STREAMS[@]}"; do
            echo "Tentando conectar em: $URL"
            ffmpeg -hide_banner -loglevel warning -stats -nostdin -y \
              -reconnect 1 \
              -reconnect_streamed 1 \
              -reconnect_at_eof 1 \
              -reconnect_on_network_error 1 \
              -reconnect_on_http_error 408,429,5xx \
              -reconnect_delay_max 60 \
              -rw_timeout 30000000 \
              -fflags +discardcorrupt \
              -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -i "$URL" \
              -t "$RECORD_SECONDS" \
              -map 0:a:0 -vn -sn -dn \
              -af "aresample=44100:async=1000:first_pts=0" \
              -ar 44100 -ac 1 -c:a pcm_s16le \
              "$RAW_FILE"
              
            if [ -s "$RAW_FILE" ]; then
              echo "Gravação concluída com sucesso usando $URL"
              break
            fi
            echo "Falha ao gravar com $URL. Tentando próximo stream da lista de fallback..."
          done
          
          test -s "$RAW_FILE"

      - name: Comprimir gravação para MP3
        run: |
          PART_FILE="${COMPRESSED_FILE}.part"
          trap 'rm -f "$PART_FILE"' EXIT
          ffmpeg -hide_banner -loglevel warning -stats -nostdin -y \
            -i "$RAW_FILE" \
            -map 0:a:0 -vn -sn -dn \
            -ar 44100 -ac 1 \
            -c:a libmp3lame -b:a "$AUDIO_BITRATE" \
            -map_metadata -1 -write_xing 1 -threads 1 \
            -f mp3 "$PART_FILE"
          test -s "$PART_FILE"
          mv "$PART_FILE" "$COMPRESSED_FILE"
          rm -f "$RAW_FILE"
          trap - EXIT

      - name: Autenticar no Google Drive via rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [gdrive]
          type = drive
          scope = drive
          token = ${{ secrets.GDRIVE_TOKEN }}
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Fazer upload idempotente com retry
        run: |
          upload_once() {
            rclone copyto "$COMPRESSED_FILE" "gdrive:Itatiaia/$COMPRESSED_FILE" \
              --checksum \
              --transfers 1 \
              --checkers 1 \
              --buffer-size 4M \
              --drive-chunk-size 8M \
              --retries 3 \
              --low-level-retries 10 \
              --retries-sleep 5s \
              --stats 30s
          }

          attempt=1
          delay=10
          until upload_once; do
            if (( attempt >= 6 )); then
              echo "Upload falhou após $attempt tentativas." >&2
              exit 1
            fi
            echo "Upload $attempt falhou; nova tentativa em ${delay}s..." >&2
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
            (( delay > 120 )) && delay=120
          done
          echo "Upload concluído: $COMPRESSED_FILE"

      - name: Limpar arquivos temporários
        if: always()
        run: rm -f "$RAW_FILE" "${COMPRESSED_FILE}.part" "$COMPRESSED_FILE"
